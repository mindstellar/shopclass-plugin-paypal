# Runs the unit tests and the integration test on every push and pull request: PHP 8.0
# against core's release/7.0 branch, PHP 8.3 against develop (SHOPCLASS_CORE_REF overrides it).
# The integration test covers 7.1 billing, so it runs on develop only; it needs MySQL.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            core: release/7.0
          - php: '8.3'
            core: develop
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SHOPCLASS_CORE: ${{ github.workspace }}/core
      DRIFT_DB_HOST: 127.0.0.1
      DRIFT_DB_PORT: 3306
      DRIFT_DB_USER: root
      DRIFT_DB_PASS: root
    steps:
      - uses: actions/checkout@v4

      - name: Check out core, whose billing classes the tests load
        uses: actions/checkout@v4
        with:
          repository: mindstellar/shopclass
          ref: ${{ matrix.core == 'develop' && vars.SHOPCLASS_CORE_REF || matrix.core }}
          path: core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, mysqli
          tools: composer

      - name: Install core's PHP packages
        working-directory: core
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Lint
        run: find . -path ./core -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Unit tests
        run: ./tests/run.sh

      - name: Integration test
        if: matrix.core == 'develop'
        run: php tests/integration/billing.php
